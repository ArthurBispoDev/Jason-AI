<div class="container">
  <div class="sidebar">
    <app-sidebar></app-sidebar>
  </div>

  <div class="content">
    <header>
      
    </header>

    <div class="chat">
      @for (message of chatService.messages(); track message.id) {
          <div
              class="message"
              [class.--user]="message.role === 'user'"
              [class.--assistant]="message.role === 'assistant'"
          >
              {{ message.content }}
          </div>
      }
    </div>

    <div class="input-chat">
      <app-input-chat></app-input-chat>
    </div>
  </div>
</div>
