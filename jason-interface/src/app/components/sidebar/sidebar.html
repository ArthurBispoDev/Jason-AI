<aside>
    <header>
        <h1>Jason AI</h1>

        <button class="new-chat">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-circle-plus preview-icon"><circle cx="12" cy="12" r="10"/><path d="M8 12h8"/><path d="M12 8v8"/></svg>
            Nova conversa
        </button>
    </header>

    <nav>
        <p class="split">Conversas</p>
        <ul>
            @for(chat of chats; track chat.id) {
                <li translate="no">
                    @if(chat.id == chatService.conversaAtualId()) {
                        <button class="chat --chat-atual">
                            {{ chat.nome }}
                        </button>
                    }@else{
                        <button class="chat" (click)="chatService.mudaConversa(chat.id)">
                            {{ chat.nome }}
                        </button>
                    }
                </li>
            }
        </ul>
        <p class="split">Configurações</p>
    </nav>
</aside>
